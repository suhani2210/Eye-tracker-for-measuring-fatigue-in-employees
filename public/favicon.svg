<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Dark background to ensure visibility on light browser tabs -->
  <circle cx="32" cy="32" r="30" fill="#050508" stroke="#1e1e2e" stroke-width="2"/>
  
  <!-- Outer Eye Shape -->
  <path d="M12 32 C 20 18, 44 18, 52 32 C 44 46, 20 46, 12 32 Z" fill="none" stroke="#00e5ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Iris / Target -->
  <circle cx="32" cy="32" r="8" fill="none" stroke="#00e5ff" stroke-width="3"/>
  <circle cx="32" cy="32" r="3" fill="#00e5ff"/>
  
  <!-- Tracker Crosshair Lines -->
  <line x1="32" y1="20" x2="32" y2="24" stroke="#00e5ff" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="40" x2="32" y2="44" stroke="#00e5ff" stroke-width="2" stroke-linecap="round"/>
  <line x1="20" y1="32" x2="24" y2="32" stroke="#00e5ff" stroke-width="2" stroke-linecap="round"/>
  <line x1="40" y1="32" x2="44" y2="32" stroke="#00e5ff" stroke-width="2" stroke-linecap="round"/>
</svg>
